name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >=11.5.1; the version bundled with
      # setup-node's node-version may be older, so pin it explicitly.
      # Pinned (not @latest) because newer npm majors require a node engine
      # ahead of the node-version above and fail with EBADENGINE.
      - run: npm install -g npm@11.5.1

      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: bun run build
      - run: npm publish
