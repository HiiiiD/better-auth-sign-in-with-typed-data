name: Version

# Keeps the "Version Packages" PR (bumped version + changelog) up to date.
# Does NOT publish — publishing happens from the Publish workflow, triggered
# by pushing the git tag once the Version PR is merged.

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Create/update Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No changesets left pending == this push was the Version PR merging.
      # Tag the release; the tag push triggers the Publish workflow.
      - name: Tag release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION"
          git push origin "v$VERSION"
